# CPS853 Team 5 — the whole system.
# Start everything from the project folder with:   docker compose up
#
# How to add your part: put your services under your section below.
# Spark services can reuse the shared settings with   <<: *spark

name: cps853

# Shared settings for every Spark container
x-spark: &spark
  image: spark:python3
  user: root # lets Spark write into the project folder
  working_dir: /work
  volumes:
    - ./:/work # the project folder appears inside the container as /work
  environment:
    PYTHONPATH: /work # lets the Spark jobs use the shared quality rules (quality/rules.py)

# Shared settings for the plain-Python containers (Part 3 and the stream consumer).
# The image is built from serve/Dockerfile the first time; PG* variables point at the database.
x-python: &python
  build: ./serve
  image: cps853-python
  working_dir: /work
  volumes:
    - ./:/work
  environment:
    PGHOST: postgres
    PGDATABASE: power
    PGUSER: power
    PGPASSWORD: power

services:
  # ---------- Part 1: Store and batch (Allen) ----------

  # Raw text -> Parquet. Bad rows go to data/quarantine/ingest.
  ingest:
    <<: *spark
    command:
      [
        "/opt/spark/bin/spark-submit",
        "--master",
        "local[*]",
        "--driver-memory",
        "2g",
        "jobs/ingest.py",
      ]
    depends_on:
      postgres:
          condition: service_started

  # Answers Q1-Q3 from Parquet. Saves results to data/results/. Runs after ingest finishes.
  batch-queries:
    <<: *spark
    command:
      [
        "/opt/spark/bin/spark-submit",
        "--master",
        "local[*]",
        "--driver-memory",
        "2g",
        "jobs/batch_queries.py",
      ]
    depends_on:
      ingest:
        condition: service_completed_successfully

    # ---------- Part 2: Stream (David) ----------

  # Taken from https://developer.confluent.io/confluent-tutorials/kafka-on-docker/
  # Required to run the Kafka broker
  kafka:
    image: apache/kafka:latest
    container_name: cps853-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1

  producer:
    <<: *spark
    command:
      [
        "sh",
        "-c",
        "pip install --no-cache-dir pyarrow kafka-python pandas && python3 streaming/producer.py",
      ]
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_started

  consumer:
    <<: *spark
    environment:
      PYTHONPATH: /work
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: power
      PGUSER: power
      PGPASSWORD: power
    command:
      [
        "sh",
        "-c",
        "pip install --no-cache-dir kafka-python psycopg[binary] pyarrow && python3 streaming/consumer.py",
      ]
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_started

  # ---------- Part 3: Serve (Sachman) ----------

  # The database. Tables are created from serve/schema.sql the first time it starts.
  # Query it by hand with:   docker compose exec postgres psql -U power -d power
  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: power
      POSTGRES_USER: power
      POSTGRES_PASSWORD: power
    ports:
      - "5433:5432" # 5433 on the laptop, in case a local PostgreSQL already uses 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U power -d power"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Initialize all PostgreSQL tables.
  # Runs after PostgreSQL is ready and before any data is loaded.
  init-db:
    <<: *python
    command: ["python", "-m", "serve.init_db"]
    depends_on:
      postgres:
        condition: service_healthy

   # Load Spark batch results and ingest quarantine into PostgreSQL.
  load-batch:
    <<: *python
    command: ["python", "-m", "serve.load_db"]
    depends_on:
      init-db:
        condition: service_completed_successfully
      batch-queries:
        condition: service_completed_successfully

  # Answers Q1-Q3 using PostgreSQL.
  # Waits until both batch loading and streaming have finished.
  serve-queries:
    <<: *python
    command: ["python", "-m", "serve.queries"]
    depends_on:
      load-batch:
        condition: service_completed_successfully

  # ---------- Part 4: Quality and monitoring (All) ----------
  # The checks run inside ingest (batch) and the consumer (stream), with the rules in quality/rules.py.

  # Rows in and out at every stage, rows failed per check, alerts, and the rows set aside.
  # Run it again at any time (even mid-stream):   docker compose run --rm --no-deps quality-report
#   quality-report:
#     <<: *python
#     command: ["python", "-m", "quality.report"]
#     depends_on:
#       serve-queries:
#         condition: service_completed_successfully

#   # Part 4 experiment only (not started by docker compose up): see quality/run_experiment.sh.
#   quality-measure:
#     <<: *python
#     command: ["python", "-m", "quality.measure"]
#     profiles: ["experiment"]

# volumes:
#   pgdata: # the database's files; removed by   docker compose down -v
